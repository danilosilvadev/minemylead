name = "mml-downloads"
main = "src/index.ts"
compatibility_date = "2026-08-01"
# Keeps the markpetrelli.workers.dev address the website uses (waitlist, downloads) working next to go.minemylead.com
workers_dev = true

# Secrets, set with wrangler and never committed:
#   wrangler secret put MASTER_TOKEN
#   wrangler secret put ADMIN_TOKEN
# Optional, overrides ADMIN_TOKEN for POST /webhook/paid:
#   wrangler secret put WEBHOOK_SECRET

# Paste the database_id from `wrangler d1 create mml-downloads` before a remote deploy.
# Signup emails are sent from the browser (assets/waitlist.js) through FormSubmit,
# because FormSubmit rate-limits requests from Cloudflare Workers. Set an address to
# also notify from the Worker.
[vars]
WAITLIST_NOTIFY = "off"
# A request for a free sample emails the owner from this address through Resend (free plan; secrets RESEND_API_KEY and NOTIFY_TO, domain verified in Resend).
# While that is not set up the request is still kept, the reason is recorded, and antiHunt pulls it. Nothing is ever sent to the visitor from here.
MAIL_FROM = "samples@minemylead.com"
# Who gets the email about a new request (the contact address of the site).
NOTIFY_TO = "contact@minemylead.com"

[[d1_databases]]
binding = "DB"
database_name = "mml-downloads"
database_id = "29ad6306-d242-4248-aad4-82fab929ada0"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "DOWNLOADS"
bucket_name = "mml-downloads"
