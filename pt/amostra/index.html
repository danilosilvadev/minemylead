/* ---------- desktop: load from the app's local server, import packs ---------- */
function packOf(b,rows){const first=rows.find((l)=>l.pack===b.id);const x=first&&first.raw.extra&&typeof first.raw.extra==="object"?first.raw.extra:{};const no=x.pack&&x.pack.id;const m=b.meta||{};return {id:b.id,name:no?(L==="en"?"Pack ":"Pacote ")+no:(m.client||b.name||b.id),made_at:m.generated_at||b.imported_at||b.first||"",registry_month:(x.pack&&x.pack.registry_month)||"",count:b.leads,client:m.client||""}}
async function loadDesktop(){const [ld,bt,se]=await Promise.all([api("/api/ws/{ws}/leads"),api("/api/ws/{ws}/batches"),api("/api/ws/{ws}/settings").catch(()=>({settings:{}}))]);
 SET={};for(const [k,v] of Object.entries(se.settings||{}))if(k.startsWith("mml_"))SET[k.slice(4)]=v;
 const rows=(ld.leads||[]).map((r)=>norm(r,r.batch_id||"pipeline"));const packs=(bt.batches||[]).map((b)=>packOf(b,rows));
 NOTE=ls.get("notes",{});OUT=ls.get("outcomes",{});ASK=ls.get("asks",{});L=ls.get("lang",L);TH=ls.get("theme",TH);setData(packs,rows);if(PKSEL&&!PACKS.find((p)=>p.id===PKSEL)){PKSEL="";pool()}}
async function importFile(f){if(!f)return;toast(fmt(t("importing"),{f:f.name}));try{if(!WS){const n=await (await fetch("/api/start",{method:"POST"})).json();WS=n.id;TOKEN=n.token;localStorage.setItem("ah_ws",JSON.stringify({id:WS,token:TOKEN}));history.replaceState(null,"","/#"+WS+"."+TOKEN)}
 const r=await fetch(`/api/ws/${WS}/import?name=${encodeURIComponent(f.name)}`,{method:"POST",headers:{authorization:"Bearer "+TOKEN},body:await f.arrayBuffer()});const d=await r.json();if(!r.ok)throw new Error(d.error||r.status);
 toast(fmt(t("imported"),{n:d.added})+(d.skipped?fmt(t("skipped"),{n:d.skipped}):""));VIEW="list";await loadDesktop();render()}catch(err){toast(fmt(t("imp_fail"),{e:err.message}))}}
document.getElementById("restoreIn").addEventListener("change",async(e)=>{const f=e.target.files[0];e.target.value="";if(!f)return;try{const d=await api("/api/ws/{ws}/restore",{method:"POST",body:await f.text()});toast(fmt(t("restored"),{n:d.restored}));await loadDesktop();render()}catch(err){toast(fmt(t("imp_fail"),{e:err.message}))}});
document.getElementById("fileIn").addEventListener("change",(e)=>{const f=e.target.files[0];e.target.value="";importFile(f)});
document.addEventListener("dragover",(e)=>e.preventDefault());document.addEventListener("drop",(e)=>{e.preventDefault();const f=e.dataTransfer&&e.dataTransfer.files[0];if(f&&MODE==="desktop")importFile(f)});
async function boot(){let h=location.hash.slice(1).split(".");if(!(h.length===2&&h[0].startsWith("ws_"))){try{const w=JSON.parse(localStorage.getItem("ah_ws")||"null");if(w&&w.id)h=[w.id,w.token]}catch{}}
 if(h.length===2&&h[0].startsWith("ws_")){WS=h[0];TOKEN=h[1];localStorage.setItem("ah_ws",JSON.stringify({id:WS,token:TOKEN}));history.replaceState(null,"","/#"+WS+"."+TOKEN);try{await loadDesktop()}catch(e){WS="";TOKEN=""}}
 render()}
if(MODE==="desktop")boot();else render();
</script>
</body>
</html>
